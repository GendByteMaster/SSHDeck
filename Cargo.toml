[package]
name = "sshdeck"
version = "0.1.0"
edition = "2024"
description = "A fast SSH workspace for developers"
license = "MIT"
repository = "https://github.com/GendByteMaster/SSHDeck"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"
