name: Cleanup Transfers Branch

on:
  push:
    branches: [dev/master]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/master
      - name: Delete merged feature branch
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/feat/transfers-workspace >/dev/null 2>&1; then
            git push origin --delete feat/transfers-workspace
          fi
      - name: Remove one-shot workflow
        run: rm .github/workflows/cleanup-transfers-branch.yml
      - name: Commit workflow removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cleanup-transfers-branch.yml
          git commit -m "chore: remove one-shot transfers cleanup workflow"
          git push origin HEAD:dev/master
