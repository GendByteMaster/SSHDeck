name: SFTP Bootstrap

on:
  push:
    branches: [feat/sftp-workspace]

permissions:
  contents: write

jobs:
  wire-sftp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/sftp-workspace

      - name: Wire SFTP commands into Tauri
        shell: python
        run: |
          from pathlib import Path

          path = Path("desktop/src-tauri/src/lib.rs")
          text = path.read_text()

          marker = "mod status;\n"
          if "mod sftp;" not in text:
              if marker not in text:
                  raise SystemExit("lib.rs module marker not found")
              text = text.replace(marker, marker + "mod sftp;\n", 1)

          builder_marker = "        .manage(Tunnels::default())\n"
          if "tauri_plugin_dialog::init()" not in text:
              if builder_marker not in text:
                  raise SystemExit("Tauri builder marker not found")
              text = text.replace(
                  builder_marker,
                  builder_marker + "        .plugin(tauri_plugin_dialog::init())\n",
                  1,
              )

          handler_marker = "            tunnel_status,\n            active_tunnels\n"
          if "sftp::sftp_list_directory" not in text:
              if handler_marker not in text:
                  raise SystemExit("Tauri handler marker not found")
              text = text.replace(
                  handler_marker,
                  "            tunnel_status,\n"
                  "            active_tunnels,\n"
                  "            sftp::sftp_list_directory,\n"
                  "            sftp::sftp_create_directory,\n"
                  "            sftp::sftp_rename,\n"
                  "            sftp::sftp_remove,\n"
                  "            sftp::sftp_upload,\n"
                  "            sftp::sftp_download\n",
                  1,
              )

          path.write_text(text)

      - name: Format Rust
        run: cargo fmt --all

      - name: Remove one-shot bootstrap workflow
        run: rm .github/workflows/sftp-bootstrap.yml

      - name: Commit wired backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/src/lib.rs desktop/src-tauri/src/sftp.rs .github/workflows/sftp-bootstrap.yml
          git commit -m "feat(sftp): wire backend commands into Tauri"
          git push origin HEAD:feat/sftp-workspace
