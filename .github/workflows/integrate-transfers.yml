name: Integrate Transfers

on:
  push:
    branches: [feat/transfers-workspace]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transfers-workspace

      - name: Integrate transfer manager and UI
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          # Tauri backend registration.
          replace("desktop/src-tauri/src/lib.rs", "mod status;\nmod sftp;", "mod status;\nmod sftp;\nmod transfers;")
          replace("desktop/src-tauri/src/lib.rs", ".manage(Tunnels::default())\n        .plugin", ".manage(Tunnels::default())\n        .manage(transfers::TransferManager::default())\n        .plugin")
          replace(
              "desktop/src-tauri/src/lib.rs",
              "            sftp::sftp_upload,\n            sftp::sftp_download\n",
              "            sftp::sftp_upload,\n            sftp::sftp_download,\n            transfers::sftp_start_upload,\n            transfers::sftp_start_download,\n            transfers::sftp_transfer_list,\n            transfers::sftp_cancel_transfer,\n            transfers::sftp_retry_transfer,\n            transfers::sftp_clear_finished\n",
          )

          # TransferProvider wraps the desktop command layer.
          replace("desktop/src/main.tsx", 'import { WorkbenchProvider } from "./WorkbenchContext";', 'import { WorkbenchProvider } from "./WorkbenchContext";\nimport { TransferProvider } from "./TransferContext";')
          replace("desktop/src/main.tsx", "  <WorkbenchProvider>\n    <CommandProvider>", "  <WorkbenchProvider>\n    <TransferProvider>\n      <CommandProvider>")
          replace("desktop/src/main.tsx", "    </CommandProvider>\n  </WorkbenchProvider>,", "      </CommandProvider>\n    </TransferProvider>\n  </WorkbenchProvider>,")

          # Bottom panel becomes the real queue surface.
          replace("desktop/src/WorkbenchChrome.tsx", 'import { PanelTab, useWorkbench } from "./WorkbenchContext";', 'import { PanelTab, useWorkbench } from "./WorkbenchContext";\nimport { TransfersPanel } from "./TransfersPanel";')
          replace("desktop/src/WorkbenchChrome.tsx", 'function PanelBody({ tab, name }: { tab: PanelTab; name: string }) {\n  const copy = {', 'function PanelBody({ tab, name }: { tab: PanelTab; name: string }) {\n  if (tab === "transfers") return <TransfersPanel />;\n  const copy = {')

          # Activity Bar Transfers opens the Bottom Panel.
          replace("desktop/src/SidebarV2.tsx", '{ id: null, label: "Transfers", icon: FolderClock, enabled: false },', '{ id: null, label: "Transfers", icon: FolderClock, enabled: true },')
          replace("desktop/src/SidebarV2.tsx", 'const { registerAppActions, primaryWidth, setPrimaryWidth, selectedServer, setSelectedServer } = useWorkbench();', 'const { choosePanel, panelTab, panelVisible, registerAppActions, primaryWidth, setPrimaryWidth, selectedServer, setSelectedServer } = useWorkbench();')
          replace("desktop/src/SidebarV2.tsx", 'const active = id !== null && view === id;', 'const active = id !== null ? view === id : label === "Transfers" && panelVisible && panelTab === "transfers";')
          replace("desktop/src/SidebarV2.tsx", 'onClick={() => { if (id) setView(id); }}', 'onClick={() => { if (id) setView(id); else if (label === "Transfers") choosePanel("transfers"); }}')

          # SFTP browser submits work to the global queue instead of blocking locally.
          replace("desktop/src/SftpBrowser.tsx", 'import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";\nimport { useTransfers } from "./TransferContext";')
          replace("desktop/src/SftpBrowser.tsx", '''type Transfer = {\n  id: string;\n  name: string;\n  direction: "upload" | "download";\n  state: "running" | "done" | "failed";\n  detail: string;\n};\n\n''', '')
          replace("desktop/src/SftpBrowser.tsx", '  const [transfers, setTransfers] = useState<Transfer[]>([]);\n\n  const server =', '  const { startDownload, startUpload } = useTransfers();\n\n  const server =')

          start_block = '''  function startTransfer(name: string, direction: Transfer["direction"], detail: string) {\n    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;\n    const transfer: Transfer = { id, name, direction, state: "running", detail };\n    setTransfers((current) => [transfer, ...current].slice(0, 6));\n    return id;\n  }\n\n  function finishTransfer(id: string, state: "done" | "failed", detail: string) {\n    setTransfers((current) => current.map((item) => item.id === id ? { ...item, state, detail } : item));\n  }\n\n'''
          replace("desktop/src/SftpBrowser.tsx", start_block, '')

          old_upload = '''    const name = selected.replace(/\\\\/g, "/").split("/").pop() || selected;\n    const transferId = startTransfer(name, "upload", `→ ${path}`);\n    try {\n      await invoke("sftp_upload", { serverId, localPath: selected, remoteDirectory: path });\n      finishTransfer(transferId, "done", `Uploaded to ${path}`);\n      await load();\n    } catch (value) {\n      finishTransfer(transferId, "failed", String(value));\n      setError(String(value));\n    }'''
          new_upload = '''    try {\n      await startUpload(serverId, selected, path);\n    } catch (value) {\n      setError(String(value));\n    }'''
          replace("desktop/src/SftpBrowser.tsx", old_upload, new_upload)

          old_download = '''    const transferId = startTransfer(entry.name, "download", `← ${entry.path}`);\n    try {\n      await invoke("sftp_download", { serverId, remotePath: entry.path, localPath: destination });\n      finishTransfer(transferId, "done", `Saved to ${destination}`);\n    } catch (value) {\n      finishTransfer(transferId, "failed", String(value));\n      setError(String(value));\n    }'''
          new_download = '''    try {\n      await startDownload(serverId, entry.path, destination);\n    } catch (value) {\n      setError(String(value));\n    }'''
          replace("desktop/src/SftpBrowser.tsx", old_download, new_download)

          recent = '''\n    {transfers.length > 0 && <section className="max-h-36 shrink-0 overflow-y-auto border-t border-white/[0.055] bg-[#090b0f]/70 px-2.5 py-2">\n      <div className="mb-1.5 text-[9.5px] font-semibold uppercase tracking-[0.12em] text-zinc-700">Recent transfers</div>\n      {transfers.map((transfer) => <div key={transfer.id} className="flex items-start gap-2 rounded-lg px-1.5 py-1.5">\n        <span className="mt-0.5 text-zinc-600">{transfer.state === "running" ? <LoaderCircle size={12} className="animate-spin" /> : transfer.state === "done" ? <Check size={12} className="text-emerald-400" /> : <X size={12} className="text-rose-400" />}</span>\n        <span className="min-w-0 flex-1"><strong className="block truncate text-[10.5px] font-medium text-zinc-400">{transfer.direction === "upload" ? "↑" : "↓"} {transfer.name}</strong><small className={`mt-0.5 block truncate text-[9.5px] ${transfer.state === "failed" ? "text-rose-400/70" : "text-zinc-700"}`}>{transfer.detail}</small></span>\n      </div>)}\n    </section>}'''
          replace("desktop/src/SftpBrowser.tsx", recent, '')

      - name: Format Rust
        run: cargo fmt --all

      - name: Remove one-shot workflow
        run: rm .github/workflows/integrate-transfers.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/src/lib.rs desktop/src-tauri/src/transfers.rs desktop/src/main.tsx desktop/src/WorkbenchChrome.tsx desktop/src/SidebarV2.tsx desktop/src/SftpBrowser.tsx desktop/src/TransferContext.tsx desktop/src/TransfersPanel.tsx .github/workflows/integrate-transfers.yml
          git commit -m "feat(transfers): integrate queue with SFTP workspace"
          git push origin HEAD:feat/transfers-workspace
