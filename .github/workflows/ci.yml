name: CI

on:
  push:
    branches: [main, dev/master]
  pull_request:
    branches: [main, dev/master]

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

  desktop:
    name: Desktop checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Check UI contracts
        working-directory: desktop
        run: npm run test:ui-contracts

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Test Tauri backend
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Check Tauri backend
        working-directory: desktop/src-tauri
        run: cargo check

  windows-desktop:
    name: Windows desktop gate
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Check UI contracts
        working-directory: desktop
        run: npm run test:ui-contracts

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Test Tauri backend
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Check Tauri backend
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Build Windows desktop binary
        working-directory: desktop
        run: npm run tauri -- build --debug --no-bundle

      - name: Smoke launch Windows desktop
        shell: pwsh
        working-directory: desktop
        run: |
          $exe = Join-Path $PWD "src-tauri\target\debug\sshdeck-desktop.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Path (Join-Path $PWD "src-tauri\target\debug") -Filter "*.exe" -ErrorAction SilentlyContinue
            throw "SSHDeck Windows executable was not produced at $exe"
          }

          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "SSHDeck exited during startup smoke with code $($process.ExitCode)"
            }
            Write-Host "SSHDeck remained alive through the Windows startup smoke."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
