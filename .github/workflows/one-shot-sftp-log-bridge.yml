name: one-shot SFTP log bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev/master]

jobs:
  apply:
    if: github.head_ref == 'feat/workbench-logs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workbench-logs

      - name: Emit completed SFTP diagnostics
        shell: python
        run: |
          from pathlib import Path

          path = Path("desktop/src-tauri/src/lib.rs")
          text = path.read_text()
          marker = '''#[tauri::command]
          fn copy_text(text: String) -> Result<(), String> {'''.replace("          ", "")
          wrapper = '''#[tauri::command]
          fn sftp_diagnose(
              server_id: String,
              app: AppHandle,
          ) -> Result<sftp_diagnostics::SftpDiagnosticResult, String> {
              let result = sftp_diagnostics::sftp_diagnose(server_id)?;
              let _ = app.emit("sshdeck://sftp-diagnostic", result.clone());
              Ok(result)
          }

          '''.replace("          ", "")
          if marker not in text:
              raise SystemExit("copy_text marker not found")
          text = text.replace(marker, wrapper + marker, 1)

          old = "            sftp_diagnostics::sftp_diagnose,"
          new = "            sftp_diagnose,"
          if old not in text:
              raise SystemExit("generate_handler SFTP marker not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-sftp-log-bridge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/src/lib.rs .github/workflows/one-shot-sftp-log-bridge.yml
          git commit -m "feat(logs): emit SFTP diagnostic events"
          git push origin HEAD:feat/workbench-logs
