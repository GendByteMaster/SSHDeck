name: SFTP Registry Source Fix

on:
  push:
    branches: [feat/sftp-workspace]

permissions:
  contents: write

jobs:
  fix-registry-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sftp-workspace

      - name: Keep SFTP independent from Servers search
        shell: python
        run: |
          from pathlib import Path

          app = Path("desktop/src/App.tsx")
          text = app.read_text()
          old = '<SidebarV2 favorites={favorites} groups={groups} query={query}'
          new = '<SidebarV2 servers={servers} favorites={favorites} groups={groups} query={query}'
          if old not in text:
              raise SystemExit("App SidebarV2 marker not found")
          app.write_text(text.replace(old, new, 1))

          sidebar = Path("desktop/src/SidebarV2.tsx")
          text = sidebar.read_text()
          replacements = [
              ('import { useEffect, useMemo, useRef, useState } from "react";', 'import { useEffect, useRef, useState } from "react";'),
              ('type Props = {\n  favorites: SidebarServer[];', 'type Props = {\n  servers: SidebarServer[];\n  favorites: SidebarServer[];'),
              ('export function SidebarV2({ favorites, groups, query, statuses, checking, onQueryChange, onAdd, onImport, onConnect, onFavorite, onExport, onEdit, onDelete }: Props) {', 'export function SidebarV2({ servers, favorites, groups, query, statuses, checking, onQueryChange, onAdd, onImport, onConnect, onFavorite, onExport, onEdit, onDelete }: Props) {'),
              ('  const allServers = useMemo(() => [...favorites, ...groups.flatMap(([, items]) => items)], [favorites, groups]);', '  const allServers = servers;'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Sidebar marker not found: {old}")
              text = text.replace(old, new, 1)
          sidebar.write_text(text)

      - name: Remove one-shot workflow
        run: rm .github/workflows/sftp-fix-registry-source.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/App.tsx desktop/src/SidebarV2.tsx .github/workflows/sftp-fix-registry-source.yml
          git commit -m "fix(sftp): use full server registry in Remote Files"
          git push origin HEAD:feat/sftp-workspace
