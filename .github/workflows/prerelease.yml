name: Prerelease

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0_beta.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-prerelease:
    name: Build and publish Windows prerelease
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.version }}"
          }
          else {
            $refName = "${{ github.ref_name }}"
            if (-not $refName.StartsWith("release/")) {
              throw "Expected a release/* branch, got $refName"
            }
            $tag = $refName.Substring("release/".Length)
          }

          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with v: $tag"
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Preparing prerelease $tag"

      - name: Ensure release tag exists
        shell: pwsh
        run: |
          git fetch --tags --force
          $tagRef = "refs/tags/$env:RELEASE_TAG"

          git rev-parse $tagRef *> $null
          if ($LASTEXITCODE -eq 0) {
            $existingSha = (git rev-list -n 1 $tagRef).Trim()
            Write-Host "Using existing tag $env:RELEASE_TAG at $existingSha"
          }
          else {
            Write-Host "Creating tag $env:RELEASE_TAG at workflow source commit $env:GITHUB_SHA"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create tag $env:RELEASE_TAG"
            }

            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to push tag $env:RELEASE_TAG"
            }
          }

      - name: Checkout exact release tag
        shell: pwsh
        run: |
          git checkout --detach "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout release tag $env:RELEASE_TAG"
          }

          $tagSha = (git rev-parse HEAD).Trim()
          "RELEASE_COMMIT=$tagSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building exact tag $env:RELEASE_TAG at $tagSha"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      - name: Check UI contracts
        working-directory: desktop
        run: npm run test:ui-contracts

      - name: Build frontend
        working-directory: desktop
        run: npm run build

      - name: Test Tauri backend
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Check Tauri backend
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Build Windows release binary
        working-directory: desktop
        run: npm run tauri -- build --no-bundle

      - name: Prepare portable Windows asset and checksum
        shell: pwsh
        run: |
          $source = "desktop/src-tauri/target/release/sshdeck-desktop.exe"
          if (-not (Test-Path $source)) {
            throw "Release executable was not produced at $source"
          }

          $asset = "SSHDeck-$env:RELEASE_TAG-windows-x64.exe"
          Copy-Item $source $asset -Force

          $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii

          "RELEASE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Prepared $asset"
          Write-Host "SHA-256: $hash"

      - name: Create or update GitHub prerelease
        shell: pwsh
        run: |
          $notesPath = "docs/releases/$env:RELEASE_TAG.md"
          if ($env:RELEASE_TAG -match "beta") {
            $title = "🔴 SSHDeck $env:RELEASE_TAG — Windows Beta"
          }
          else {
            $title = "SSHDeck $env:RELEASE_TAG"
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            Write-Host "Release exists; refreshing prerelease metadata."
            if (Test-Path $notesPath) {
              gh release edit $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --title $title `
                --notes-file $notesPath `
                --prerelease
            }
            else {
              gh release edit $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --title $title `
                --prerelease
            }
          }
          else {
            Write-Host "Creating prerelease for existing tag $env:RELEASE_TAG."
            if (Test-Path $notesPath) {
              gh release create $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --title $title `
                --notes-file $notesPath `
                --prerelease
            }
            else {
              gh release create $env:RELEASE_TAG `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --title $title `
                --generate-notes `
                --prerelease
            }
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create or update GitHub prerelease $env:RELEASE_TAG"
          }

      - name: Upload Windows asset and checksum
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG `
            $env:RELEASE_ASSET `
            "SHA256SUMS.txt" `
            --clobber `
            --repo $env:GITHUB_REPOSITORY

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets for $env:RELEASE_TAG"
          }

      - name: Verify published prerelease
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,targetCommitish,name,isPrerelease,url,assets
