name: one-shot history integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  apply:
    if: github.head_ref == 'feat/history-workspace' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/history-workspace

      - name: Apply remaining history patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once("desktop/src-tauri/src/lib.rs", "    items.truncate(30);", "    items.truncate(200);")

          path = "desktop/src/App.tsx"
          replace_once(path, 'appendHistory({ serverId: server.id, serverName: server.name, state: "reconnected", atMs: Date.now(), durationMs: 0, exitCode: null });', 'appendHistory({ serverId: server.id, serverName: server.name, state: "reconnected", atMs: Date.now(), startedAtMs: replacement.startedAtMs, durationMs: 0, exitCode: null, signal: null });')
          replace_once(path, 'appendHistory({ serverId: tab.serverId, serverName: tab.name, state: endedState, atMs: status.endedAtMs ?? Date.now(), durationMs: status.durationMs, exitCode: status.exitCode });', 'appendHistory({ serverId: tab.serverId, serverName: tab.name, state: endedState, atMs: status.endedAtMs ?? Date.now(), startedAtMs: status.startedAtMs, durationMs: status.durationMs, exitCode: status.exitCode, signal: status.signal });')
          replace_once(path, 'appendHistory({ serverId: tab.serverId, serverName: tab.name, state: "closed", atMs: Date.now(), durationMs: tab.durationMs, exitCode: tab.exitCode });', 'appendHistory({ serverId: tab.serverId, serverName: tab.name, state: "closed", atMs: Date.now(), startedAtMs: tab.startedAtMs, durationMs: tab.durationMs, exitCode: tab.exitCode, signal: tab.signal });')

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-history-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/App.tsx desktop/src-tauri/src/lib.rs .github/workflows/one-shot-history-integration.yml
          git commit -m "feat(history): persist terminal diagnostics"
          git push origin HEAD:feat/history-workspace
