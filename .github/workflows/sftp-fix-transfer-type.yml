name: SFTP Transfer Type Fix

on:
  push:
    branches: [feat/sftp-workspace]

permissions:
  contents: write

jobs:
  fix-transfer-type:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sftp-workspace

      - name: Fix transfer literal type
        shell: python
        run: |
          from pathlib import Path

          path = Path("desktop/src/SftpBrowser.tsx")
          text = path.read_text()
          old = '''    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    setTransfers((current) => [{ id, name, direction, state: "running", detail }, ...current].slice(0, 6));
    return id;'''
          new = '''    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const transfer: Transfer = { id, name, direction, state: "running", detail };
    setTransfers((current) => [transfer, ...current].slice(0, 6));
    return id;'''
          if old not in text:
              raise SystemExit("expected startTransfer block not found")
          path.write_text(text.replace(old, new, 1))

      - name: Remove one-shot workflow
        run: rm .github/workflows/sftp-fix-transfer-type.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/SftpBrowser.tsx .github/workflows/sftp-fix-transfer-type.yml
          git commit -m "fix(sftp): preserve transfer state literal type"
          git push origin HEAD:feat/sftp-workspace
